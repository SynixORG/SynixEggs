; PHP-FPM config - part of the image, updated with it.
; Tunables come from the panel variables (environment), see start-web.

[global]
pid = /tmp/php-fpm.pid
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
; Unix socket on tmpfs: not reachable from the network
listen = /tmp/php-fpm.sock
listen.mode = 0600

pm = ondemand
pm.max_children = ${FPM_MAX_CHILDREN}
pm.process_idle_timeout = 30s
; Recycle workers to contain memory leaks in long-running apps
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no
; Do not leak container environment (panel variables) into PHP scripts
clear_env = yes
security.limit_extensions = .php

php_admin_value[disable_functions] = ${PHP_DISABLE_FUNCTIONS}
php_admin_value[session.save_path] = /home/container/.cache/php/sessions
php_admin_value[upload_tmp_dir] = /home/container/.cache/php/uploads
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
