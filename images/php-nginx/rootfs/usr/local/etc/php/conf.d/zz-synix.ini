; Image defaults on top of php.ini-production. Values in ${...} come from the
; panel variables. Override anything in /home/container/php/conf.d/*.ini.

expose_php = Off
memory_limit = ${PHP_MEMORY_LIMIT}
upload_max_filesize = ${UPLOAD_MAX_SIZE}
post_max_size = ${UPLOAD_MAX_SIZE}
max_execution_time = ${PHP_MAX_EXECUTION_TIME}
date.timezone = ${TZ}
realpath_cache_size = 4096K
realpath_cache_ttl = 600

session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

; OPcache: files are still re-checked every 2s so SFTP edits show up
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.jit = disable
