# Deny hidden files (.env, .git, .htaccess, ...) except /.well-known/
location ~ /\.(?!well-known/) {
    deny all;
    access_log off;
    log_not_found off;
}

# Deny common backup / dependency files
location ~* \.(bak|old|orig|swp|sql|sqlite|log|ini|sh)$ {
    deny all;
}
location ~ ^/(composer\.(json|lock)|package(-lock)?\.json|vendor/|node_modules/) {
    deny all;
}
