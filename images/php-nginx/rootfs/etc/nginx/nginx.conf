# Main nginx config - part of the image, updated with it.
# Site configs live in /home/container/nginx/conf.d/*.conf on the server.
# Everything here runs unprivileged: no "user" directive, writable paths only.

worker_processes 2;
pid /tmp/nginx/nginx.pid;
error_log stderr warn;
pcre_jit on;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    # Relative Location headers: behind a reverse proxy nginx only knows its
    # internal http://host:port, which visitors cannot reach.
    absolute_redirect off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # Large request bodies go to disk, not the 100 MB /tmp tmpfs
    client_body_temp_path /home/container/.cache/nginx/client_body;
    fastcgi_temp_path     /home/container/.cache/nginx/fastcgi;
    proxy_temp_path       /tmp/nginx/proxy;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/javascript
               application/json application/rss+xml image/svg+xml;

    upstream php {
        server unix:/tmp/php-fpm.sock;
    }

    include /home/container/nginx/conf.d/*.conf;
}
